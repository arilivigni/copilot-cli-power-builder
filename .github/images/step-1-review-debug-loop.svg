<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Step 1 review debug loop</title>
  <desc id="desc">A flow chart showing a review and debug branch moving from risky change to review, fix, and regression tests.</desc>
  <rect width="1200" height="420" fill="#0d1117" rx="24"/>
  <text x="60" y="70" fill="#f0f6fc" font-size="34" font-family="Arial, sans-serif" font-weight="700">feature/review-debug-loop</text>
  <text x="60" y="108" fill="#8b949e" font-size="20" font-family="Arial, sans-serif">Start with one focused branch and tighten the code-review - debug - test loop.</text>
  <rect x="60" y="170" width="250" height="120" rx="18" fill="#1f6feb"/>
  <text x="88" y="220" fill="#ffffff" font-size="26" font-family="Arial, sans-serif" font-weight="700">Intentional bug</text>
  <text x="88" y="255" fill="#dbeafe" font-size="20" font-family="Arial, sans-serif">Add one small risky change</text>
  <rect x="475" y="170" width="250" height="120" rx="18" fill="#238636"/>
  <text x="525" y="220" fill="#ffffff" font-size="26" font-family="Arial, sans-serif" font-weight="700">Review first</text>
  <text x="503" y="255" fill="#dcfce7" font-size="20" font-family="Arial, sans-serif">Capture review findings</text>
  <rect x="890" y="170" width="250" height="120" rx="18" fill="#8250df"/>
  <text x="932" y="220" fill="#ffffff" font-size="26" font-family="Arial, sans-serif" font-weight="700">Fix + tests</text>
  <text x="930" y="255" fill="#ede9fe" font-size="20" font-family="Arial, sans-serif">Ship regression coverage</text>
  <path d="M320 230 H455" stroke="#8b949e" stroke-width="8" stroke-linecap="round"/>
  <polygon points="455,230 430,215 430,245" fill="#8b949e"/>
  <path d="M735 230 H870" stroke="#8b949e" stroke-width="8" stroke-linecap="round"/>
  <polygon points="870,230 845,215 845,245" fill="#8b949e"/>
</svg>
