<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Step 4 MCP context flow</title>
  <desc id="desc">A diagram showing the review and debug branch receiving context from the built-in GitHub MCP server and one project-level MCP source.</desc>
  <rect width="1200" height="420" fill="#0d1117" rx="24"/>
  <text x="60" y="70" fill="#f0f6fc" font-size="34" font-family="Arial, sans-serif" font-weight="700">Add live context to feature/review-debug-loop</text>
  <text x="60" y="108" fill="#8b949e" font-size="20" font-family="Arial, sans-serif">Verify built-in GitHub access, then add one project-level MCP source.</text>
  <rect x="70" y="170" width="280" height="145" rx="18" fill="#1f6feb"/>
  <text x="125" y="220" fill="#ffffff" font-size="26" font-family="Arial, sans-serif" font-weight="700">GitHub MCP</text>
  <text x="118" y="258" fill="#dbeafe" font-size="20" font-family="Arial, sans-serif">Built-in check with /mcp show</text>
  <rect x="460" y="160" width="280" height="165" rx="18" fill="#30363d" stroke="#8b949e" stroke-width="3"/>
  <text x="495" y="220" fill="#f0f6fc" font-size="26" font-family="Arial, sans-serif" font-weight="700">feature/review-debug-loop</text>
  <text x="500" y="258" fill="#8b949e" font-size="20" font-family="Arial, sans-serif">Branch now has richer context</text>
  <rect x="850" y="170" width="280" height="145" rx="18" fill="#238636"/>
  <text x="930" y="220" fill="#ffffff" font-size="26" font-family="Arial, sans-serif" font-weight="700">.mcp.json</text>
  <text x="899" y="258" fill="#dcfce7" font-size="20" font-family="Arial, sans-serif">One project MCP source</text>
  <path d="M360 242 H445" stroke="#8b949e" stroke-width="8" stroke-linecap="round"/>
  <polygon points="445,242 420,227 420,257" fill="#8b949e"/>
  <path d="M750 242 H835" stroke="#8b949e" stroke-width="8" stroke-linecap="round"/>
  <polygon points="835,242 810,227 810,257" fill="#8b949e"/>
</svg>
